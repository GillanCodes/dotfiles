# Make r refresh the config
unbind r
bind r

# Set leader key to ctrl s
set -g prefix C-s

# Activate Mouse
set -g mouse on

# Bind hjkl to left down up right
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

#Setup Sesh keybind
bind-key "K" display-popup -E -w 40% "sesh connect \"$(
    sesh list -i | gum filter \
        --limit 1 \
        --no-sort \
        --fuzzy \
        --placeholder 'Pick a sesh' \
        --height 50 \
        --prompt='🚂'
)\""

# Set bar top
set-option -g status-position top

#Option to preview images
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"
# Passthough
set -g allow-passthrough on


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

#Gruvbox theme
set -g @plugin 'egel/tmux-gruvbox'

# display path and enhance section with other plugin
set -g @tmux-gruvbox-right-status-z '#{pane_current_path} #{tmux_mode_indicator}'

run '~/.tmux/plugins/tpm/tpm'


